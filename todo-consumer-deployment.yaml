# ================================================================
# BEFORE DEPLOYING: Replace <YOUR_NAMESPACE> with your OpenShift
# project/namespace name (e.g. kafka-project)
# ================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-consumer
  namespace: <YOUR_NAMESPACE> # Replace with your namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-consumer
  template:
    metadata:
      labels:
        app: todo-consumer
    spec:
      containers:
      - name: todo-consumer
        # Replace <YOUR_NAMESPACE> with your namespace
        image: image-registry.openshift-image-registry.svc:5000/<YOUR_NAMESPACE>/todo-consumer:latest
        command: ["python", "consumer.py"]
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          # Replace <YOUR_NAMESPACE> with your namespace
          value: "kafka.<YOUR_NAMESPACE>.svc.cluster.local:9092"
        - name: KAFKA_SECURITY_PROTOCOL
          value: "SASL_PLAINTEXT"
        - name: KAFKA_SASL_MECHANISM
          value: "SCRAM-SHA-256"
        - name: KAFKA_USERNAME
          value: "user1"
        - name: KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kafka-user-passwords
              key: client-passwords
        - name: KAFKA_TOPIC
          value: "todo_tasks"
        - name: DB_HOST
          # Replace <YOUR_NAMESPACE> with your namespace
          value: "postgresql.<YOUR_NAMESPACE>.svc.cluster.local"
        - name: DB_NAME
          value: "todo_db"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          # Update this with your PostgreSQL password
          value: "postgres"
        - name: DB_PORT
          value: "5432"
